<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipVault</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header>
      <nav id="tabs">
        <button data-tab="history" class="active">History</button>
        <button data-tab="vault">Vault</button>
      </nav>
      <input id="search" type="search" placeholder="Search clipboard…" autocomplete="off" spellcheck="false" />
    </header>

    <main>
      <section id="view-history">
        <ul id="list" class="rows"></ul>
        <p id="empty" class="empty hidden">Nothing here yet. Copy something.</p>
      </section>

      <section id="view-vault" class="hidden">
        <div id="vault-gate" class="gate">
          <h2 id="gate-title">Unlock vault</h2>
          <p id="gate-hint" class="hint"></p>
          <form id="gate-form">
            <input id="gate-pw" type="password" placeholder="Master password" autocomplete="off" />
            <input id="gate-pw2" type="password" placeholder="Confirm password" autocomplete="off" class="hidden" />
            <button type="submit" id="gate-submit">Unlock</button>
          </form>
          <p id="gate-error" class="error"></p>
        </div>

        <div id="vault-open" class="hidden">
          <div class="toolbar">
            <button id="vault-new">New secret</button>
            <button id="vault-lock-btn" class="ghost">Lock now</button>
            <span id="vault-timer" class="timer"></span>
          </div>
          <ul id="vault-list" class="rows"></ul>
          <p id="vault-empty" class="empty hidden">The vault is empty.</p>
        </div>
      </section>
    </main>

    <footer id="status"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
